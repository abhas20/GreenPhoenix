[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhas20" }
]
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=5.0.0",
    "boto3>=1.43.89",
    "cedar-policy>=0.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "opensearch-py>=3.2.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "spacy>=3.8.16",
    "sqlmodel>=0.0.42",
    "strands-agents>=1.55.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
